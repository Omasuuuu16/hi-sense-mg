<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4d4d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8a8a8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <path d="M100 450 L700 450 L720 480 L80 480 Z" fill="url(#bodyGrad)" />
  <rect x="80" y="480" width="640" height="20" rx="5" fill="#808080" />
  
  <!-- Lid/Screen -->
  <rect x="120" y="100" width="560" height="350" rx="10" fill="#2a2a2a" />
  <rect x="135" y="115" width="530" height="320" fill="url(#screenGrad)" />
  
  <!-- HP Logo (Simplified) -->
  <circle cx="400" cy="275" r="40" fill="#0096D6" />
  <text x="400" y="290" font-family="Arial, sans-serif" font-weight="bold" font-size="35" text-anchor="middle" fill="white">HP</text>
  
  <!-- Keyboard area hint -->
  <rect x="150" y="455" width="500" height="15" fill="#333" opacity="0.1" />
</svg>

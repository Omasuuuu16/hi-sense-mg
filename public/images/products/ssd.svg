<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Case -->
  <rect x="100" y="50" width="400" height="300" rx="10" fill="url(#metal)" stroke="#555" stroke-width="2" />
  
  <!-- Label -->
  <rect x="150" y="100" width="300" height="200" rx="5" fill="#ecf0f1" />
  <rect x="150" y="100" width="300" height="50" rx="5" fill="#333" />
  
  <text x="300" y="135" font-family="Arial, sans-serif" font-weight="bold" font-size="24" text-anchor="middle" fill="white">Solid State Drive</text>
  <text x="300" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="60" text-anchor="middle" fill="#333">SSD</text>
  
  <!-- Connector -->
  <rect x="200" y="350" width="200" height="10" fill="#333" />
  <rect x="220" y="350" width="50" height="10" fill="#f1c40f" />
  <rect x="280" y="350" width="100" height="10" fill="#f1c40f" />
</svg>

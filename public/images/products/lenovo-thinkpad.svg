<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <path d="M100 450 L700 450 L720 480 L80 480 Z" fill="#222" />
  <rect x="80" y="480" width="640" height="20" rx="2" fill="#111" />
  
  <!-- Lid/Screen -->
  <rect x="120" y="100" width="560" height="350" rx="5" fill="#1a1a1a" />
  <rect x="135" y="115" width="530" height="320" fill="url(#screenGrad)" />
  
  <!-- ThinkPad Styling -->
  <text x="620" y="430" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ddd" transform="rotate(-15 620,430)">ThinkPad</text>
  <circle cx="658" cy="418" r="3" fill="red" />

  <!-- Screen Content -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-weight="bold" font-size="40" text-anchor="middle" fill="#333">Lenovo</text>
</svg>

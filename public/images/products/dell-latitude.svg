<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <path d="M100 450 L700 450 L720 480 L80 480 Z" fill="#95a5a6" />
  <rect x="80" y="480" width="640" height="15" rx="3" fill="#7f8c8d" />
  
  <!-- Lid/Screen -->
  <rect x="120" y="100" width="560" height="350" rx="8" fill="#34495e" />
  <rect x="135" y="115" width="530" height="320" fill="#1a1a1a" />
  
  <!-- Dell Logo Hint inside screen -->
  <circle cx="400" cy="275" r="35" stroke="white" stroke-width="2" fill="none" opacity="0.8"/>
  <text x="400" y="282" font-family="Arial, sans-serif" font-weight="bold" font-size="20" text-anchor="middle" fill="white" opacity="0.8">DELL</text>
</svg>
